name: tictactoe Workflow

# When this workflow runs
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

# This workflow will build and push the tictactoe project
defaults:
  run:
    working-directory: tictactoe

permissions:
  contents: read
  packages: write

jobs:
  Build-push-tictactoe:
  
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Go 1.26.5
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
  
  
    


      - name: Test the cli
        run: go test ./... 

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./tictactoe/Dockerfile.cli
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tictactoecli:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tictactoecli:latest
