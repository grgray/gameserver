name: tictactoe Workflow

# When this workflow runs
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

# This workflow will test, build and push the tictactoe backend and frontend.
defaults:
  run:
    working-directory: tictactoe/backend

permissions:
  contents: read
  packages: write

jobs:
  Build-push-tictactoe:

    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Go 1.26.5
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Test the backend
        run: go test ./...

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tictactoe/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: tictactoe/frontend
        run: npm ci

      - name: Build the frontend
        working-directory: tictactoe/frontend
        run: npm run build

      - name: Test the frontend
        working-directory: tictactoe/frontend
        run: npm test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cli image
        uses: docker/build-push-action@v6
        with:
          context: ./tictactoe
          file: ./tictactoe/Dockerfile.cli
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tictactoecli:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tictactoecli:latest

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./tictactoe
          file: ./tictactoe/Dockerfile.server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tictactoeserver:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tictactoeserver:latest
