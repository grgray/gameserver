name: sudoku Workflow

# When this workflow runs
on:
  push:
    branches: [ main ]
    paths:
      - 'Sudoku/**'
      - '.github/workflows/sudoku.yaml'
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

# This workflow builds and pushes the Sudoku image. It's a multi-arch build
# (amd64 + arm64) since the eventual target is a Raspberry Pi running k3s.
permissions:
  contents: read
  packages: write

jobs:
  Build-push-sudoku:

    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Sudoku
          file: ./Sudoku/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sudoku:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sudoku:latest
