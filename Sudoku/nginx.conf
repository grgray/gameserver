server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: fall back to index.html for any path that isn't a
    # real file, so client-side routing (if ever added) still works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|woff2?|ttf|wasm|data)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
